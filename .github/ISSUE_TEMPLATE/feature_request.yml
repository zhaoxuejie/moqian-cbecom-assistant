name: 功能建议
description: 提出使用场景与改进建议
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前问题
      description: 谁在什么场景下，需要完成什么任务？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
  - type: textarea
    id: alternatives
    attributes:
      label: 当前的替代方法
