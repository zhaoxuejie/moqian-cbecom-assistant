name: Bug 报告
description: 部署、问答、工具、后台或评测出现问题
body:
  - type: markdown
    attributes:
      value: 请先搜索已有 Issue。日志和截图请脱敏；安全漏洞按 SECURITY.md 私密报告。
  - type: textarea
    id: behavior
    attributes:
      label: 实际行为与预期行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小问题样例，说明是否使用自带虚构语料和 mock 工具。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      description: 提交号、操作系统、Docker/Python 版本；模型名称即可，不要贴密钥。
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
