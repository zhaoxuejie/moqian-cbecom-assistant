<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>会话管理 · 客服智能体管理台</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<script src="../controllers/theme-boot.js?v=20261091"></script>
<link rel="stylesheet" href="/ui-design/tokens.css" />
<link rel="stylesheet" href="../styles/admin.css?v=20261091" />
</head>
<body data-page="conversations">
<div class="layout">

  <!-- 侧边栏由 layout.js 注入（单点维护），页面只留挂载点 -->
  <aside class="side" id="appSide"></aside>

  <div class="main">
    <header class="topbar">
      <h1>会话管理</h1>
      <span class="topbar__sub">按会话聚合的访客对话：先筛选定位，再进详情导出举证材料</span>
      <div class="topbar__right">
        <span class="topbar__pill">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          本机环境
        </span>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="convSearch" placeholder="搜索订单号 / 会话号 / 对话内容…" />
        </div>
        <select class="select" id="convCountry" title="按目的国家筛选">
          <option value="">全部国家</option>
          <option value="US">US</option>
          <option value="UK">UK</option>
          <option value="DE">DE</option>
          <option value="FR">FR</option>
          <option value="ES">ES</option>
        </select>
        <select class="select" id="convLanguage" title="按会话语言筛选">
          <option value="">全部语言</option>
          <option value="en">英语 en</option>
          <option value="es">西语 es</option>
          <option value="fr">法语 fr</option>
          <option value="de">德语 de</option>
        </select>
        <select class="select" id="convHandoff" title="按转人工原因筛选">
          <option value="">全部（含未转人工）</option>
          <option value="refund">退款</option>
          <option value="complaint">投诉</option>
          <option value="legal">法务</option>
          <option value="account">账户安全</option>
        </select>
        <span style="flex:1"></span>
        <button class="btn btn--ghost btn--sm" id="convReset" type="button">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          重置
        </button>
        <button class="btn btn--ghost btn--sm" id="convRefresh" type="button">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/></svg>
          刷新
        </button>
      </div>

      <div class="card">
        <div class="card__head">
          <h2>会话列表</h2>
          <span class="card__head spacer"></span>
          <span id="convNote" style="font-size:11.5px;color:#8a97a3">—</span>
        </div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th style="width:110px">会话号</th>
                <th style="width:136px">开始时间</th>
                <th>国家 / 语言</th>
                <th>订单号</th>
                <th style="width:86px" class="num">消息</th>
                <th style="width:70px" class="num">工具</th>
                <th style="width:110px">转人工</th>
                <th style="width:150px">原因</th>
                <th class="cell-actions" style="width:96px">操作</th>
              </tr>
            </thead>
            <tbody id="convRows"></tbody>
          </table>
        </div>
        <div class="empty" id="convEmpty" hidden>
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          当前筛选下没有会话
        </div>
      </div>
      <div class="pager" id="convPager"></div>

      <div class="hint" style="margin-top:14px">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>会话按「一次访问」聚合，举证材料也是按会话打包的。点<b>查看详情</b>可看消息流、引用原文、
        工具调用与转人工记录，并在详情页导出 JSON / Markdown 证据包。</span>
      </div>
      <div class="hint" style="margin-top:6px">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>演示数据全部虚构，导出文件本身也带「虚构演示数据」与「不保证诉讼胜诉」两条声明。</span>
      </div>
    </main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script src="../adapters/real-api.js?v=20261091"></script>
<script src="../adapters/conversations-api.js?v=20261091"></script>
    <script src="../controllers/i18n.js?v=20261092"></script>
    <script src="../controllers/layout.js?v=20261091"></script>
<script src="../controllers/app.js?v=20261091"></script>
<script src="../controllers/conversations.js?v=20261091"></script>
<script src="../controllers/preview.js?v=20261091"></script>
</body>
</html>
