<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · 客服智能体管理台</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<script src="../controllers/theme-boot.js?v=20261081"></script>
<link rel="stylesheet" href="/ui-design/tokens.css" />
    <link rel="stylesheet" href="../styles/admin.css?v=20261081" />
</head>
<body data-page="login">
<div class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="login-logo">
      <span class="login-logo__mark">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </span>
      <b>客服智能体 · 管理台</b>
    </div>
    <div class="login-sub">跨境独立站客服智能体 · 知识库运营与评测平台</div>

    <div class="field">
      <label data-i18n="login.account">账号</label>
      <input id="lgUser" type="text" data-i18n-placeholder="login.account" placeholder="账号" value="" autocomplete="username" />
    </div>
    <div class="field">
      <label data-i18n="login.password">密码</label>
      <input id="lgPass" type="password" placeholder="平台密码" value="" autocomplete="current-password" />
    </div>
    <div class="field" id="lgCaptchaField" hidden>
      <label>验证码</label>
      <div style="display:flex;gap:10px;align-items:center">
        <input id="lgCaptcha" type="text" placeholder="输入右侧验证码" maxlength="8" autocomplete="off"
          style="flex:1;min-width:0" />
        <button type="button" id="lgCaptchaBtn" title="点击换一张"
          style="flex:none;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;height:44px;cursor:pointer;overflow:hidden">
          <img id="lgCaptchaImg" alt="验证码" style="height:42px;display:block" />
        </button>
      </div>
      <div class="sub" style="margin-top:4px">看不清可点击图片换一张；验证码 5 分钟内有效。</div>
    </div>
    <div class="login-err" id="lgErr"></div>
    <button class="btn btn--primary btn--block" type="submit" data-i18n="login.submit">登 录</button>
    <button class="btn btn--ghost btn--block" type="button" id="langToggle" style="margin-top:8px">EN</button>

    <div class="login-foot">使用平台账号登录；登录态保存在本机浏览器 localStorage，未登录无法进入内页。</div>
  </form>
</div>
  <script src="../controllers/i18n.js?v=20261092"></script>
  <script src="../adapters/real-api.js?v=20261081"></script>
<script src="../controllers/app.js?v=20261081"></script>
</body>
</html>
