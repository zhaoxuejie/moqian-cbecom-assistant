# 评测集（跨境版，90 条；语料为 samples/demo-corpus 的 13 份英文文档 + 15 条 mock 订单）
#
# 分层（P7）：
#   A 政策 RAG     30 条：引用可核验、旧版不误用
#   B 工具调用     25 条：订单/物流查询、单号不存在、超时降级、缺单号追问
#   C 硬转人工     15 条：退款/投诉/法务/账户安全（平静语气也转）
#   D 应拒答       10 条：库外、他人订单、与平台无关的法律意见
#   E 多语言       10 条：西 4 / 法 3 / 德 3（只测语言与口径，不测翻译质量）
#
# 约定：
# - `keywords` 只用于**检索命中**判定（出现在 topN 证据正文即可），不要求回答逐字包含；
#   全部取自语料原文（含 en dash，如 "5–7 business days"）。
# - B 层故障用例（tool_timeout）与 C 层硬转都**不生成答案**，因此同时标 `expect.refuse: true`，
#   否则会被 runner 的"应作答却拒答"规则误判；C 层再用 `expect.handoff` 断言类别。
# - B 层缺单号的 3 条不做 tool 断言（runner 目前只核验"调了什么"，不核验"没调"），note 里写明期望。
# - `noArchived: true`：不得引用归档/过期切片（US 旧版 60 天那条是核心）。
# - `fixture.fault` 只给 B 层故障用例（评测时临时打开 DEMO_FAULT_ENABLED）。

